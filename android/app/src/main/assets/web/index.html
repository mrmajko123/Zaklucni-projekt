<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Order</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="header">
    <div class="logo">fast order</div>
    <nav id="nav">
      <button class="nav-btn" data-category="drinks">
        <svg viewBox="0 0 24 24" fill="white" width="36" height="36">
          <path d="M3 2l2.01 18h13.99l2.01-18H3zm13.13 5h-2.24l-.58 6h-2.1l-.58-6H8.85l-.58 6H6.17l.58-6H4.53L3.85 4h16.3l-.68 3h-2.06l.58 6h-2.1l.58-6h2.06l.68-3z"/>
        </svg>
        <span>drinks</span>
      </button>
      <button class="nav-btn active" data-category="foods">
        <svg viewBox="0 0 24 24" fill="white" width="36" height="36">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <span>foods</span>
      </button>
      <button class="nav-btn" data-category="combos">
        <svg viewBox="0 0 24 24" fill="white" width="36" height="36">
          <path d="M18.06 22.99h1.66c.84 0 1.53-.64 1.63-1.46L23 5.05h-5V1h-1.97v4.05h-4.97l.3 2.34c1.71.47 3.31 1.32 4.27 2.26 1.44 1.42 2.43 2.89 2.43 5.29v8.05zM1 21.99V21h15.03v.99c0 .55-.45 1-1.01 1H2.01c-.56 0-1.01-.45-1.01-1zm15.03-7c0-4.58-6.03-5.99-6.03-5.99v-2h-3v2S1 10.41 1 14.99h15.03z"/>
        </svg>
        <span>combos</span>
      </button>
      <button class="nav-btn" data-category="all">
        <svg viewBox="0 0 24 24" fill="white" width="36" height="36">
          <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
        </svg>
        <span>all</span>
      </button>
    </nav>
  </header>

  <main id="products"></main>

  <button id="cart-btn">
    <svg viewBox="0 0 24 24" fill="white" width="32" height="32">
      <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
    </svg>
    <span id="cart-count" class="hidden">0</span>
  </button>

  <div id="cart-panel" class="hidden">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button id="cart-close">&times;</button>
    </div>
    <div id="cart-items"></div>
    <div id="cart-total">
      <span>Total:</span>
      <span id="cart-total-price">&euro;0.00</span>
    </div>
    <button id="cart-order">Order Now</button>
  </div>

  <div id="order-modal" class="hidden">
    <div class="modal-content">
      <h2>Order Confirmed!</h2>
      <p>Your order has been placed successfully.</p>
      <button id="modal-close">OK</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
